name: Build OrangeFox for Redmi 12 4G (fire)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libreadline-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox Source
      run: |
        mkdir OFRP
        cd OFRP
        git config --global user.name "moshiurrahman167"
        git config --global user.email "moshiurrahman167@github.com"
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd OFRP
        git clone https://github.com/moshiurrahman167/android_device_xiaomi_fire.git -b android-12.1 device/xiaomi/fire

    - name: Build OrangeFox
      run: |
        cd OFRP
        source build/envsetup.sh
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE=Stable
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DYNAMIC_FULL_SIZE=9126805504
        
        lunch omni_fire-eng || lunch fox_fire-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: OrangeFox_Redmi_12_4G_fire
        path: |
          OFRP/out/target/product/fire/*.zip
          OFRP/out/target/product/fire/*.img
